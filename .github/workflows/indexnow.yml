# Kampio: site GitHub'a yüklendiğinde değişen sayfaları IndexNow ile Bing ve Yandex'e bildirir.
# Elle çalıştırmak ve sitemap'teki tüm adresleri göndermek için: Actions > IndexNow > Run workflow > all = true
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "true yazarsanız sitemap'teki tüm adresler gönderilir"
        default: "false"

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cloudflare yayını için bekle
        run: sleep 150

      - name: IndexNow gönder
        env:
          INDEXNOW_KEY: f94d0be5dd51ff44ab34fd7654661d5d
          BEFORE: ${{ github.event.before }}
          SEND_ALL: ${{ github.event.inputs.all }}
        run: |
          python3 - <<'PY'
          import os, re, json, subprocess, urllib.request, urllib.error
          HOST = "www.kampio.com.tr"
          KEY = os.environ["INDEXNOW_KEY"]
          SKIP = ("404.html",)
          SKIP_PREFIX = ("pinterest-", "yandex_")
          def to_url(f):
              return f"https://{HOST}/" if f == "index.html" else f"https://{HOST}/{f}"
          urls = []
          if os.environ.get("SEND_ALL") == "true":
              sm = open("sitemap.xml", encoding="utf-8").read()
              urls = re.findall(r"<loc>([^<]+)</loc>", sm)
          else:
              before = os.environ.get("BEFORE", "")
              cmds = []
              if before and set(before) != {"0"}:
                  cmds.append(["git", "diff", "--name-only", "--diff-filter=AM", before, "HEAD"])
              cmds.append(["git", "diff", "--name-only", "--diff-filter=AM", "HEAD^", "HEAD"])
              files = None
              for c in cmds:
                  r = subprocess.run(c, capture_output=True, text=True)
                  if r.returncode == 0:
                      files = r.stdout.split()
                      break
              files = files or []
              for f in files:
                  if "/" in f or not f.endswith(".html"):
                      continue
                  if f in SKIP or f.startswith(SKIP_PREFIX):
                      continue
                  urls.append(to_url(f))
          urls = sorted(set(urls))
          print(f"{len(urls)} adres gönderilecek")
          for u in urls:
              print(" -", u)
          if not urls:
              raise SystemExit(0)
          body = json.dumps({
              "host": HOST,
              "key": KEY,
              "keyLocation": f"https://{HOST}/{KEY}.txt",
              "urlList": urls[:10000],
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://api.indexnow.org/IndexNow", data=body,
              headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("IndexNow yanıtı:", resp.status)
          except urllib.error.HTTPError as e:
              print("IndexNow hata:", e.code, e.read().decode("utf-8", "ignore")[:300])
              raise SystemExit(1)
          PY
